---
name: Pull Request

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  frontend:
    name: Check Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ./MedLog/frontend
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: 'MedLog/frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: MedLog/frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run build

